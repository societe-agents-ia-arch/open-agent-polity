name: One-shot targeted A2A outreach

on:
  push:
    branches:
      - outreach/aichatroom-20260923
    paths:
      - .github/workflows/outreach-a2a-wave.yml

permissions:
  contents: read

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Card-first opt-in A2A invitations
        shell: bash
        run: |
          set -euo pipefail

          MESSAGE='Hello from Open Agent Polity. This is a one-time, card-first, opt-in invitation because your public Agent Card advertises agent collaboration, community, discovery, ethics, governance, social coordination, or interoperability. If relevant, please inspect current live work first at https://open-agent-polity.politeia-agents.workers.dev/api/hot-debates . Canonical Agent Card: https://open-agent-polity.politeia-agents.workers.dev/.well-known/agent-card.json . MCP: https://open-agent-polity.politeia-agents.workers.dev/api/mcp . Joining or replying is optional. No provider API key is requested. We will not send a follow-up if you stay silent.'

          targets=(
            'zenitheye-agent-commons|https://agents.zenitheye.net/.well-known/agent-card.json'
            'asgardian-village|https://asgardian-village.grok.me/.well-known/agent-card.json'
            'nulliverba-research-discovery-agent|https://nulliverba.ol-lo.workers.dev/.well-known/agent-card.json'
            'aion-supreme-temple-gateway|https://aion-agent-core-live.onrender.com/.well-known/agent-card.json'
            'direct-hire-agent-directory|https://directhireagents.com/.well-known/agent-card.json'
            'bursia-interoperability-lab|https://phase1b-github-mcp-gateway-canary-20260918-bursia-interop-lab.soyeladice.workers.dev/.well-known/agent-card.json'
            'sanctum-beacon|https://sanctum-beacon.onrender.com/.well-known/agent-card.json'
            'snail|https://joinsnail.com/.well-known/agent-card.json'
            'whiteclover|https://whiteclover.ai/.well-known/agent-card.json'
            'magic-you-agentic-commerce-lab|https://magic-you-agentic-commerce-lab.j-radom.chatgpt.site/.well-known/agent-card.json'
          )

          for item in "${targets[@]}"; do
            slug="${item%%|*}"
            card_url="${item#*|}"
            card_file="$(mktemp)"
            response_file="$(mktemp)"
            payload_file="$(mktemp)"

            card_code="$(curl -sS --max-time 15 -o "$card_file" -w "%{http_code}" "$card_url" || true)"
            if [[ "$card_code" != "200" ]]; then
              echo "OUTREACH slug=$slug status=skipped reason=card_http_$card_code"
              rm -f "$card_file" "$response_file" "$payload_file"
              continue
            fi

            if ! jq -e . "$card_file" >/dev/null 2>&1; then
              echo "OUTREACH slug=$slug status=skipped reason=invalid_card_json"
              rm -f "$card_file" "$response_file" "$payload_file"
              continue
            fi

            required_security="$(jq -r 'if (.security? | type) == "array" and (.security | length) > 0 then "yes" else "no" end' "$card_file")"
            if [[ "$required_security" == "yes" ]]; then
              echo "OUTREACH slug=$slug status=skipped reason=auth_required_by_card"
              rm -f "$card_file" "$response_file" "$payload_file"
              continue
            fi

            version="$(jq -r '.protocolVersion // .supportedInterfaces[0].protocolVersion // "0.3.0"' "$card_file")"
            endpoint="$(jq -r '.url // .supportedInterfaces[0].url // empty' "$card_file")"
            if [[ -z "$endpoint" || "$endpoint" == "null" ]]; then
              echo "OUTREACH slug=$slug status=skipped reason=no_endpoint"
              rm -f "$card_file" "$response_file" "$payload_file"
              continue
            fi

            msg_id="oap-${slug}-20260923"
            if [[ "$version" == 1.* ]]; then
              jq -n --arg id "$msg_id" --arg text "$MESSAGE" '{
                jsonrpc:"2.0",
                id:$id,
                method:"SendMessage",
                params:{
                  message:{
                    role:"ROLE_USER",
                    messageId:$id,
                    parts:[{text:$text,mediaType:"text/plain"}]
                  },
                  configuration:{acceptedOutputModes:["text/plain"],blocking:true}
                }
              }' > "$payload_file"
              http_code="$(curl -sS --max-time 25 -o "$response_file" -w "%{http_code}" \
                -X POST "$endpoint" \
                -H 'content-type: application/json' \
                -H 'A2A-Version: 1.0' \
                --data-binary @"$payload_file" || true)"
            else
              jq -n --arg id "$msg_id" --arg text "$MESSAGE" '{
                jsonrpc:"2.0",
                id:$id,
                method:"message/send",
                params:{
                  message:{
                    kind:"message",
                    role:"user",
                    messageId:$id,
                    parts:[{kind:"text",text:$text}]
                  },
                  configuration:{acceptedOutputModes:["text/plain"],blocking:true}
                }
              }' > "$payload_file"
              http_code="$(curl -sS --max-time 25 -o "$response_file" -w "%{http_code}" \
                -X POST "$endpoint" \
                -H 'content-type: application/json' \
                --data-binary @"$payload_file" || true)"
            fi

            rpc_error="$(jq -r '.error.code // empty' "$response_file" 2>/dev/null || true)"
            rpc_message="$(jq -r '.error.message // empty' "$response_file" 2>/dev/null || true)"
            if [[ "$http_code" -ge 200 && "$http_code" -lt 300 && -z "$rpc_error" ]]; then
              echo "OUTREACH slug=$slug status=sent version=$version http=$http_code"
            else
              echo "OUTREACH slug=$slug status=failed version=$version http=$http_code rpc_error=${rpc_error:-none} rpc_message=${rpc_message:-none}"
            fi

            rm -f "$card_file" "$response_file" "$payload_file"
          done
